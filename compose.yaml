services:
  catalog-db:
    image: postgres:16-alpine
    container_name: catalog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalog_db}
      POSTGRES_USER: ${POSTGRES_USER:-catalog_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalog_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catalog_user} -d ${POSTGRES_DB:-catalog_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-redis:
    image: redis:7-alpine
    container_name: catalog-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - catalog_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kafka en modo KRaft, un solo nodo, solo para pruebas locales.
  catalog-kafka:
    image: apache/kafka:3.9.0
    container_name: catalog-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Servicio de catalogo: solo se levanta con el perfil "app" (docker compose --profile app up -d --build).
  # Usa la base del compose y se conecta a REST, Redis y Kafka de la catedra con lo definido en .env.
  catalog-service:
    build: .
    container_name: catalog-service
    profiles: [ "app" ]
    restart: on-failure:3
    depends_on:
      catalog-db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://catalog-db:5432/${POSTGRES_DB:-catalog_db}
      DB_USER: ${POSTGRES_USER:-catalog_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-catalog_password}
      JWT_SECRET: ${JWT_SECRET:-}
      CATEDRA_API_BASE_URL: ${CATEDRA_API_BASE_URL:-}
      CATEDRA_JWT_TOKEN: ${CATEDRA_JWT_TOKEN:-}
      CATEDRA_API_CONNECT_TIMEOUT_MS: ${CATEDRA_API_CONNECT_TIMEOUT_MS:-5000}
      CATEDRA_API_READ_TIMEOUT_MS: ${CATEDRA_API_READ_TIMEOUT_MS:-10000}
      CATEDRA_REDIS_HOST: ${CATEDRA_REDIS_HOST:-localhost}
      CATEDRA_REDIS_PORT: ${CATEDRA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_USERNAME: ${SPRING_DATA_REDIS_USERNAME:-}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}
      CATEDRA_KAFKA_BOOTSTRAP_SERVERS: ${CATEDRA_KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
      CATEDRA_KAFKA_CONSUMER_GROUP_ID: ${CATEDRA_KAFKA_CONSUMER_GROUP_ID:-alumnos-local-catalog}
      CATEDRA_KAFKA_CATALOG_TOPIC: ${CATEDRA_KAFKA_CATALOG_TOPIC:-catedra.catalog.local}
      CATALOG_RECONCILIATION_ENABLED: ${CATALOG_RECONCILIATION_ENABLED:-true}
      CATALOG_RECONCILIATION_INTERVAL_MS: ${CATALOG_RECONCILIATION_INTERVAL_MS:-300000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PASSWORD_ARGON2_MEMORY_KIB: ${PASSWORD_ARGON2_MEMORY_KIB:-19456}
      PASSWORD_ARGON2_ITERATIONS: ${PASSWORD_ARGON2_ITERATIONS:-2}
      PASSWORD_ARGON2_PARALLELISM: ${PASSWORD_ARGON2_PARALLELISM:-1}

volumes:
  catalog_db_data:
  catalog_redis_data: