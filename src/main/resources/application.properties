spring.application.name=service-catalog

# PostgreSQL Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
spring.datasource.username=${DB_USER:catalog_user}
spring.datasource.password=${DB_PASSWORD:catalog_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Cliente Cátedra Snapshot
catedra.api.base-url=http://192.168.194.250:8090
catedra.api.jwt-token=tu-token-jwt-aqui
