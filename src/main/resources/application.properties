spring.application.name=service-catalog

# PostgreSQL Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
spring.datasource.username=${DB_USER:catalog_user}
spring.datasource.password=${DB_PASSWORD:catalog_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Cliente Cátedra Snapshot
catedra.api.base-url=${CATEDRA_API_BASE_URL:}
catedra.api.jwt-token=${CATEDRA_JWT_TOKEN:}
catedra.api.connect-timeout-ms=${CATEDRA_API_CONNECT_TIMEOUT_MS:5000}
catedra.api.read-timeout-ms=${CATEDRA_API_READ_TIMEOUT_MS:10000}