spring.application.name=service-catalog

# PostgreSQL Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
spring.datasource.username=${DB_USER:catalog_user}
spring.datasource.password=${DB_PASSWORD:catalog_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Cliente Cátedra Snapshot
catedra.api.base-url=${CATEDRA_API_BASE_URL:}
catedra.api.jwt-token=${CATEDRA_JWT_TOKEN:}
catedra.api.connect-timeout-ms=${CATEDRA_API_CONNECT_TIMEOUT_MS:5000}
catedra.api.read-timeout-ms=${CATEDRA_API_READ_TIMEOUT_MS:10000}

# Redis de Catedra (usuario y contrasena por SPRING_DATA_REDIS_USERNAME / SPRING_DATA_REDIS_PASSWORD)
spring.data.redis.host=${CATEDRA_REDIS_HOST:localhost}
spring.data.redis.port=${CATEDRA_REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
catedra.redis.namespace=catedra:sync

# Kafka (local: contenedor del compose; real: valores de la integracion de catedra)
spring.kafka.bootstrap-servers=${CATEDRA_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${CATEDRA_KAFKA_CONSUMER_GROUP_ID:alumnos-local-catalog}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
catedra.kafka.catalog-topic=${CATEDRA_KAFKA_CATALOG_TOPIC:catedra.catalog.local}

# Reconciliacion de versiones (al arrancar y periodica). Apagada por defecto para que los tests no consulten a la catedra.
catalog.reconciliation.enabled=${CATALOG_RECONCILIATION_ENABLED:false}
catalog.reconciliation.interval-ms=${CATALOG_RECONCILIATION_INTERVAL_MS:300000}
catalog.reconciliation.max-attempts=4
catalog.reconciliation.initial-backoff-ms=2000
catalog.reconciliation.max-backoff-ms=30000

# Hash de contrasenas (Argon2id). Valores minimos recomendados por OWASP.
password.argon2.memory-kib=${PASSWORD_ARGON2_MEMORY_KIB:19456}
password.argon2.iterations=${PASSWORD_ARGON2_ITERATIONS:2}
password.argon2.parallelism=${PASSWORD_ARGON2_PARALLELISM:1}